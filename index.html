<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0c0d10">
    <title>AgarV1 | Client</title>
    <link rel="stylesheet" href="/src/index.css">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Toast de Conexión (Estilo Bootstrap Popup) -->
    <div id="connecting-overlay">
        <div class="connecting-content">
            <div id="connecting-spinner" class="spinner"></div>
            <p id="connecting-text">Connecting to server...</p>
        </div>
    </div>

    <div id="main-menu" class="menu-overlay">
        <div class="menu-container">
            <!-- Columna Izquierda: Perfil / Tienda / Stats -->
            <div class="menu-col left-col">
                <div class="panel profile-panel">
                    <div class="profile-header">
                        <div class="profile-avatar">
                            <canvas id="skin-preview-canvas" width="60" height="60"></canvas>
                        </div>
                        <div class="profile-info">
                            <div class="profile-name">Player</div>
                            <div class="profile-level">
                                <div class="level-bar-bg">
                                    <div class="level-bar-fill" style="width: 45%;"></div>
                                </div>
                                <span class="level-text">Lvl 1</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="panel shop-mini-panel">
                    <div class="shop-header">
                        <h3>Shop & Offers</h3>
                        <span class="currency"><i class="icon-coin"></i> <span id="user-coins">0</span></span>
                    </div>
                    <!-- Botón para abrir la tienda completa (como modal) -->
                    <button class="btn btn-secondary" onclick="document.getElementById('modal-shop').classList.add('active')">Open Shop</button>
                </div>
            </div>

            <!-- Columna Central: Título y Jugar -->
            <div class="menu-col center-col">
                <div class="panel play-panel">
                    <div class="title-container">
                        <h1>AgarV1</h1>
                    </div>
                    <div class="input-group">
                        <input type="text" id="nickname" placeholder="Nick" maxlength="15">
                    </div>
                    <button id="play-btn" class="btn btn-play">Play</button>
                    <button id="spectate-btn" class="btn btn-spectate">Spectate</button>
                    <footer class="menu-footer">
                        <p>&copy; 2023 AgarV1. All rights reserved.</p>
                    </footer>
                     
                </div>
            </div>

            <!-- Columna Derecha: Configuración / Modos / Extra -->
            <div class="menu-col right-col">
                <div class="panel servers-panel">
                    <h3>Servers</h3>
                    <div id="server-list" class="server-list">
                        <!-- Servidores inyectados por JS -->
                    </div>
                </div>
                
                <div class="panel actions-panel">
                    <button class="btn btn-square" onclick="document.getElementById('modal-settings').classList.add('active')">
                        <span class="icon">⚙️</span> Settings
                    </button>
                    <button class="btn btn-square" onclick="document.getElementById('modal-hotkeys').classList.add('active')">
                        <span class="icon">⌨️</span> Hotkeys
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modales para Pestañas Secundarias -->
    <div id="modal-settings" class="modal">
        <div class="modal-content panel">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" onclick="this.closest('.modal').classList.remove('active')">&times;</button>
            </div>
            <div class="settings-box">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-names" checked>
                    <span class="checkmark"></span> Show Names
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="show-mass" checked>
                    <span class="checkmark"></span> Show Mass
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="no-skins">
                    <span class="checkmark"></span> No Skins
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="dark-theme" checked>
                    <span class="checkmark"></span> Dark Mode
                </label>
                <div class="slider-container">
                    <label for="anim-delay">Animation Delay: <span id="anim-delay-value">120</span>ms</label>
                    <input type="range" id="anim-delay" min="50" max="240" value="120">
                </div>
                <label class="checkbox-container">
                    <input type="checkbox" id="gpu-btn" checked>
                    <span class="checkmark"></span> GPU
                </label>
            </div>
        </div>
    </div>

    <div id="modal-hotkeys" class="modal">
        <div class="modal-content panel">
            <div class="modal-header">
                <h2>Hotkeys</h2>
                <button class="close-btn" onclick="this.closest('.modal').classList.remove('active')">&times;</button>
            </div>
            <div class="hotkeys-section">
                <!-- Se inyectan las hotkeys existentes -->
                <div class="hotkey-item"><span>Split</span><button class="key-btn" id="key-split" data-action="split">Space</button></div>
                <div class="hotkey-item"><span>Feed</span><button class="key-btn" id="key-feed" data-action="feed">W</button></div>
                <div class="hotkey-item"><span>Double Split</span><button class="key-btn" id="key-double" data-action="double">Q</button></div>
                <div class="hotkey-item"><span>Triple Split</span><button class="key-btn" id="key-triple" data-action="triple">E</button></div>
                <div class="hotkey-item"><span>Quad Split</span><button class="key-btn" id="key-quad" data-action="quad">C</button></div>
                <div class="hotkey-item"><span>Macro Feed</span><button class="key-btn" id="key-macro" data-action="macro">Z</button></div>
                <div class="hotkey-item"><span>Bot Split</span><button class="key-btn" id="key-botSplit" data-action="botSplit">E</button></div> 
                <div class="hotkey-item"><span>Bot Feed</span><button class="key-btn" id="key-botFeed" data-action="botFeed">R</button></div>
                <div class="hotkey-item"><span>Freeze</span><button class="key-btn" id="key-freeze" data-action="freeze">F</button></div>
            </div>
        </div>
    </div>

    <div id="modal-shop" class="modal">
        <div class="modal-content panel modal-large">
            <div class="modal-header">
                <h2>Shop</h2>
                <button class="close-btn" onclick="this.closest('.modal').classList.remove('active')">&times;</button>
            </div>
            <!-- Estructura de shop simplificada para el modal -->
            <div class="shop-container">
                <div class="shop-sidebar">
                    <button class="shop-cat-btn active" data-cat="level">Level</button>
                    <button class="shop-cat-btn" data-cat="owner">Owner</button>
                    <button class="shop-cat-btn" data-cat="coins">Coins</button>
                </div>
                <div class="shop-main">
                    <div id="shop-grid" class="shop-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- HUD Elements (in-game) -->
    <div id="hud-container">
        <button id="fullscreen-btn" class="hud-btn" title="Fullscreen">⛶</button>
        <button id="toggle-ui-btn" class="hud-btn" title="Toggle UI">👁</button>
        
        <div id="leaderboard" class="hud-panel" style="display: none;">
            <h3>Leaderboard</h3>
            <ol id="lb-list"></ol>
        </div>

    <div id="touch-controls" style="display: none;">
        <div id="joystick-container">
            <div id="joystick-nipple"></div>
        </div>
        <div id="mobile-buttons">
            <div class="mobile-btn" id="btn-split">Split</div>
            <div class="mobile-btn" id="btn-feed">Feed</div>
        </div>
    </div>

    <div id="stats" class="hud-panel" style="display: none;">
        <span id="fps">FPS: 0</span>
        <span id="mass">Mass: 0</span>
        <span id="ping">Ping: 0</span>
    </div>
    </div> <!-- Cierra hud-container -->

    <script src="src/core/Game.js" type="module"></script>
</body>


</html>

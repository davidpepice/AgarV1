<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgarV1 | Client</title>
    <link rel="stylesheet" href="/src/index.css">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="main-menu" class="overlay">
        <div id="connecting-overlay">
            <div class="connecting-content">
                <div id="connecting-spinner" class="spinner"></div>
                <p id="connecting-text">Connecting to server...</p>
            </div>
        </div>
        <h1>AgarV1</h1>

        <div class="menu-tabs">
            <button class="tab-btn active" data-tab="tab-play">Play</button>
            <button class="tab-btn" data-tab="tab-shop">Shop</button>
            <button class="tab-btn" data-tab="tab-settings">Settings</button>
            <button class="tab-btn" data-tab="tab-hotkeys">Hotkeys</button>
        </div>

        <div id="tab-play" class="tab-content active">
            <div class="input-group">
                <input type="text" id="nickname" placeholder="Nickname" maxlength="15">
                <input type="text" id="server-url" value="ws://localhost:8080" placeholder="Server URL">
            </div>
            <div class="button-group">
                <button id="play-btn">Play</button>
                <button id="spectate-btn">Spectate</button>
            </div>
        </div>

        <div id="tab-shop" class="tab-content">
            <div class="shop-header">
                <span class="currency"><i class="icon-coin"></i> <span id="user-coins">0</span> Coins</span>
            </div>
            <div class="shop-container">
                <div class="shop-sidebar">
                    <button class="shop-cat-btn active" data-cat="level">Level</button>
                    <button class="shop-cat-btn" data-cat="owner">Owner</button>
                    <button class="shop-cat-btn" data-cat="premium">Premium</button>
                    <button class="shop-cat-btn" data-cat="coins">Coins</button>
                </div>
                <div class="shop-main">
                    <div id="shop-grid" class="shop-grid">
                        <!-- Items will be injected here -->
                    </div>
                </div>
                <div class="shop-preview">
                    <h3>Preview</h3>
                    <div id="skin-preview-container">
                        <canvas id="skin-preview-canvas" width="200" height="200"></canvas>
                        <div id="preview-name">Select a skin</div>
                    </div>
                    <button id="buy-select-btn" class="shop-action-btn" disabled>Select Skin</button>
                </div>
            </div>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="settings-box">
                <label class="checkbox-container">
                    <input type="checkbox" id="show-names" checked>
                    <span class="checkmark"></span>
                    Show Names
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="show-mass" checked>
                    <span class="checkmark"></span>
                    Show Mass
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="no-skins">
                    <span class="checkmark"></span>
                    No Skins
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="dark-theme" checked>
                    <span class="checkmark"></span>
                    Dark Mode
                </label>
                <div class="slider-container">
                    <label for="anim-delay">Animation Delay: <span id="anim-delay-value">120</span>ms</label>
                    <input type="range" id="anim-delay" min="50" max="240" value="120">
                </div>
            </div>
        </div>

        <div id="tab-hotkeys" class="tab-content">
            <div class="hotkeys-section">
                <div class="hotkey-item">
                    <span>Split</span>
                    <button class="key-btn" id="key-split" data-action="split">Space</button>
                </div>
                <div class="hotkey-item">
                    <span>Feed</span>
                    <button class="key-btn" id="key-feed" data-action="feed">W</button>
                </div>
                <div class="hotkey-item">
                    <span>Double Split</span>
                    <button class="key-btn" id="key-double" data-action="double">Q</button>
                </div>
                <div class="hotkey-item">
                    <span>Triple Split</span>
                    <button class="key-btn" id="key-triple" data-action="triple">E</button>
                </div>
                <div class="hotkey-item">
                    <span>Quad Split</span>
                    <button class="key-btn" id="key-quad" data-action="quad">C</button>
                </div>
                <div class="hotkey-item">
                    <span>Macro Feed</span>
                    <button class="key-btn" id="key-macro" data-action="macro">Z</button>
                </div>
                <div class="hotkey-item">
                    <span>Bot Split</span>
                    <button class="key-btn" id="key-bot-split" data-action="botSplit">R</button>
                </div>
                <div class="hotkey-item">
                    <span>Bot Feed</span>
                    <button class="key-btn" id="key-bot-feed" data-action="botFeed">T</button>
                </div>
                <div class="hotkey-item">
                    <span>Freeze</span>
                    <button class="key-btn" id="key-freeze" data-action="freeze">F</button>
                </div>
            </div>
        </div>
    </div>

    <div id="leaderboard" class="hud-item" style="display: none;">
        <h3>Leaderboard</h3>
        <ol id="lb-list"></ol>
    </div>

    <div id="touch-controls" style="display: none;">
        <div id="joystick-container">
            <div id="joystick-nipple"></div>
        </div>
        <div id="mobile-buttons">
            <div class="mobile-btn" id="btn-split">Split</div>
            <div class="mobile-btn" id="btn-feed">Feed</div>
        </div>
    </div>

    <div id="stats" class="hud-item" style="display: none;">
        <span id="fps">FPS: 0</span>
        <span id="mass">Mass: 0</span>
        <span id="ping">Ping: 0</span>
    </div>

    <script src="src/core/Game.js" type="module"></script>
</body>

</html>
